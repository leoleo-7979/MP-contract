<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계약서 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="loginwrap hide">
  <form class="card loginbox" id="loginForm">
    <div class="brand">마이크로프로텍트</div>
    <h1>계약서 관리</h1>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="msg err" id="loginMsg"></div>
    <button class="btn pri" type="submit">들어가기</button>
  </form>
</div>

<div id="app" class="shell hide">
  <aside class="side">
    <div class="brandbox"><div class="brand">마이크로프로텍트</div><div class="appname">계약서 관리</div></div>
    <button class="nav" data-act="go" data-v="home" id="nav-home">메인 메뉴</button>
    <div class="grp">계약서</div>
    <button class="nav" data-act="go" data-v="renew" id="nav-renew">재직자 갱신</button>
    <button class="nav" data-act="go" data-v="new" id="nav-new">신규 입사</button>
    <button class="nav" data-act="go" data-v="confirm" id="nav-confirm">만든 계약서 확인</button>
    <div class="grow"></div>
    <div class="stat" id="stat"></div>
    <button class="nav" data-act="reload">시트·계약서 다시 불러오기</button>
    <button class="nav" data-act="logout">로그아웃</button>
  </aside>
  <main class="main">
    <header class="top"><h1 id="title"></h1><div id="topchips"></div></header>
    <div id="view"></div>
  </main>
</div>

<script src="pako.min.js"></script>
<script src="jszip.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
