<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계약서 관리</title>
<style>
:root{--bg:#FBF4F8;--ink:#3A2E4A;--mut:#6B5E7B;--pur:#6B47B8;--pur-d:#3A2470;--pink:#F6DDEA;--pink-d:#7A2A55;--line:#EADFF0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
.shell{display:flex;min-height:100vh}
.side{flex:0 0 250px;background:#fff;border-right:1px solid #EFE4F3;padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brandbox{padding:6px 14px 18px}.brand{font-size:12px;color:var(--mut)}.appname{font-size:20px;font-weight:700;color:var(--pur-d)}
.grp{padding:14px 14px 4px;font-size:12px;color:var(--mut)}.grow{flex:1}
.nav{display:flex;align-items:center;width:100%;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:#4B3D5E;font-size:15px;text-align:left;min-height:44px}
.nav:hover{background:#F3E7F6}.nav.on{background:#EADCF8;color:var(--pur-d);font-weight:700}
.stat{padding:12px 14px;border-radius:12px;background:#FBF1F7;font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:6px}
.main{flex:1;min-width:0;padding:28px 36px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:26px;color:var(--pur-d)}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(120,80,150,.08);padding:22px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;min-height:44px}
.btn.pri{background:var(--pur);color:#fff}.btn.sec{background:var(--pink);color:var(--pink-d)}.btn.ghost{background:#fff;color:#4B3D5E;border:1px solid #D9CCE6}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid #D9CCE6;background:#fff;color:#4B3D5E;border-radius:999px;padding:8px 16px;font-size:14px;min-height:40px}
.chip.on{background:var(--pur);color:#fff;border-color:var(--pur)}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.tag.d0{background:#FFD9DF;color:#9B1C3C}.tag.d1{background:#FFE9D6;color:#8A4310}.tag.d2{background:#E4F1E4;color:#285A2C}
.tag.warn{background:#FFE9D6;color:#8A4310}.tag.ok{background:#E4F1E4;color:#285A2C}.tag.new{background:#E3E9FF;color:#2B3F9A}.tag.bad{background:#FFD9DF;color:#9B1C3C}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F3EAF6;vertical-align:middle}
td.nw{white-space:nowrap}
tr.sel td{background:#FBF1F7}tr.no td{color:#8a809a}
.tw{overflow-x:auto}
.ck{width:26px;height:26px;border-radius:7px;border:2px solid #B9A6D6;background:#fff;color:#fff;font-size:16px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ck.on{background:var(--pur);border-color:var(--pur)}.ck[disabled]{opacity:.35;cursor:not-allowed}
.step{width:34px;height:34px;border-radius:10px;border:1px solid #D9CCE6;background:#fff;font-size:18px;padding:0}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--mut)}
.field input,.field select,.sel{border:1px solid #D9CCE6;border-radius:10px;padding:9px 12px;min-height:42px;background:#fff}
.field input.miss{border-color:#C9355A;background:#FFF5F7}
td input,td select{border:1px solid #D9CCE6;border-radius:8px;padding:6px 8px;min-height:36px;width:100%;min-width:110px;background:#fff}
td input.miss{border-color:#C9355A;background:#FFF5F7}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.num{font-size:38px;font-weight:700}.lbl{font-size:14px;color:var(--mut)}
.menucard{border:0;text-align:left;background:#fff;border-radius:18px;padding:24px;box-shadow:0 2px 10px rgba(120,80,150,.08);display:flex;flex-direction:column;gap:8px;color:var(--ink);min-height:140px}
.menucard:hover{box-shadow:0 4px 16px rgba(120,80,150,.18)}.menucard b{font-size:20px}.menucard span{font-size:14px;color:var(--mut);line-height:1.6}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.list{flex:0 0 270px;display:flex;flex-direction:column;gap:8px}
.list .nav{flex-direction:column;align-items:flex-start;gap:2px}.list small{color:var(--mut);font-weight:400}
.doc{border:1px solid var(--line);border-radius:14px;padding:24px 30px;background:#FFFEFD;max-height:420px;overflow:auto}
.doc p{margin:0 0 8px;line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-all}
.hl{background:#FFE58F;border-radius:3px;padding:0 2px}
.del{background:#FFD9DF;text-decoration:line-through;border-radius:3px;padding:0 2px}
.chg{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px;line-height:1.7;word-break:break-all;white-space:pre-wrap}
.chg .b{color:var(--mut)}
.msg{font-size:13px;color:var(--mut)}.msg.err{color:#B3261E}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.loginbox{width:360px;display:flex;flex-direction:column;gap:12px}.loginbox h1{margin:0 0 6px;color:var(--pur-d)}
.loginbox input{border:1px solid #D9CCE6;border-radius:10px;padding:10px 12px;min-height:44px}
.note{background:#FBF1F7;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.7;color:#4B3D5E}
.bar{height:8px;border-radius:99px;background:#EADFF0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pur);width:0}
@media (max-width:900px){.shell{flex-direction:column}.side{position:static;height:auto;flex:none}.cards4,.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:20px 16px}}

.why{font-size:12px;color:#B3261E;font-weight:400;white-space:normal;max-width:240px;line-height:1.4;margin-top:2px}
tr.gh td{background:#EADCF8;color:#3A2470;font-weight:700;padding:8px 12px}
tr.gs td{background:#FBF1F7;color:#7A2A55;font-weight:500;font-size:13px;padding:6px 12px 6px 24px}
</style>
</head>
<body>
<noscript>자바스크립트를 켜 주세요.</noscript>
<div id="app" class="shell">
  <aside class="side">
    <div class="brandbox"><div class="brand">마이크로프로텍트</div><div class="appname">계약서 관리</div></div>
    <button class="nav" data-act="go" data-v="home" id="nav-home">메인 메뉴</button>
    <div class="grp">계약서</div>
    <button class="nav" data-act="go" data-v="renew" id="nav-renew">재직자 갱신</button>
    <button class="nav" data-act="go" data-v="new" id="nav-new">신규 입사</button>
    <button class="nav" data-act="go" data-v="confirm" id="nav-confirm">만든 계약서 확인</button>
    <div class="grow"></div>
    <div class="stat" id="stat"></div>
    <button class="nav" data-act="reload">시트·계약서 다시 불러오기</button>
    <button class="nav" data-act="setup">설정 (시트 주소 · 폴더)</button>
  </aside>
  <main class="main">
    <header class="top"><h1 id="title"></h1><div id="topchips"></div></header>
    <div id="view"></div>
  </main>
</div>

  var dis = m.bad || !S.acks[S.sel];
  return (S.note ? '<div class="note">' + esc(S.note) + '</div>' : '') +
    '<div class="split"><div class="card list"><b>만든 계약서 ' + S.made.length + '건</b>' + list + '</div>' +
    '<div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px">' +
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:18px">' + esc(m.name) + ' 계약서 (' + esc(m.fname) + ')</b><span class="tag new">실제 줄바꿈은 한글에서 확인</span></div>' +
    '<div style="margin-bottom:6px"><b>바뀐 곳 ' + d.changed.length + '곳</b></div>' + chg +
    '<details style="margin-top:10px"><summary>계약서 전체 글자 보기</summary><div class="doc" style="margin-top:8px">' + d.full.map(function (h) { return '<p>' + h + '</p>'; }).join('') + '</div></details></div>' +
    '<div class="cards3" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><b>자동 점검</b><div style="margin-top:12px">' + checks + '</div></div>' +
    '<div class="card"><b>내려받기 · 저장</b><div class="row" style="margin:14px 0"><button class="ck' + (S.acks[S.sel] ? ' on' : '') + '" data-act="ack" aria-label="확인했습니다">' + (S.acks[S.sel] ? '✓' : '') + '</button><span>바뀐 부분을 확인했습니다</span></div>' +
    '<div class="row" style="gap:10px"><button class="btn pri" data-act="dlone"' + (dis ? ' disabled' : '') + '>이 파일 받기</button>' +
    '<button class="btn sec" data-act="saveone"' + (dis ? ' disabled' : '') + '>폴더에 저장</button></div>' +
    (m.saved ? '<p class="msg">' + esc(m.saved) + '</p>' : '') +
    '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="row" style="gap:10px"><button class="btn ghost" data-act="ackall">모두 확인함으로 표시</button>' +
    '<button class="btn pri" data-act="dlall"' + (allAck && okAll ? '' : ' disabled') + '>전체 zip 받기</button><button class="btn sec" data-act="saveall"' + (allAck && okAll ? '' : ' disabled') + '>전체 폴더 저장</button></div>' +
    (S.busy ? '<p class="msg">' + esc(S.busy) + '</p>' : '') + '</div></div></div></div>';
}

// ---------- 내려받기·저장
function dl(blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
function saveDrive(m) {
  if (!S.dir) { m.saved = '폴더 저장은 "폴더 고르기"로 고른 경우에만 됩니다. 내려받기를 이용해 주세요.'; return Promise.resolve(); }
  return perm(S.dir, true).then(function (p) { if (p !== 'granted') throw new Error('폴더 쓰기 권한이 없습니다'); return S.dir.getDirectoryHandle('작업완료', { create: true }); })
    .then(function (d) { return d.getFileHandle(m.fname, { create: true }); })
    .then(function (fh) { return fh.createWritable(); })
    .then(function (w) { return w.write(m.bytes).then(function () { return w.close(); }); })
    .then(function () { m.saved = '계약서 폴더 안 "작업완료" 폴더에 저장됨 ' + new Date().toLocaleTimeString('ko-KR'); })
    .catch(function (e) { m.saved = '저장 실패: ' + e.message; });
}

function rSetup() {
  var cnt = S.files ? S.files.filter(function (f) { return /\.hwp$/i.test(f.name); }).length : 0;
  var fold = S.dir ? '선택한 폴더: <b>' + esc(S.dir.name) + '</b>' : S.files ? '선택한 폴더: <b>' + esc(((S.files[0] && S.files[0].webkitRelativePath) || '').split('/')[0]) + '</b> (hwp ' + cnt + '개)' : '아직 고르지 않았습니다';
  var btns = HAS_FS
    ? '<button class="btn sec" data-act="pickdir">폴더 고르기</button>'
    : '<input type="file" webkitdirectory data-act="dirfb"><p class="msg">이 브라우저는 폴더에 바로 저장하지 못하고 내려받기만 됩니다. 크롬이나 엣지를 쓰면 바로 저장됩니다.</p>';
  return '<div class="card" style="max-width:760px;display:flex;flex-direction:column;gap:20px">' +
    '<div><b style="font-size:18px">1. 시트 주소</b><p class="msg">시트를 "링크가 있는 모든 사용자 - 뷰어"로 공유해 두어야 읽을 수 있습니다.</p><input class="sel" style="width:100%" id="surl" data-act="surl" value="' + esc(S.sheetUrl) + '" aria-label="시트 주소"></div>' +
    '<div><b style="font-size:18px">2. 계약서 폴더</b><p class="msg">계약서(.hwp)가 들어 있는 폴더(하위 폴더 포함)를 고르세요. 한 번 고르면 기억합니다. 만든 계약서는 이 폴더 안 "작업완료" 폴더에 저장됩니다.</p><div style="margin-bottom:10px">' + fold + '</div>' + btns + '</div>' +
    '<div><button class="btn pri" data-act="start"' + (S.dir || S.files ? '' : ' disabled') + '>' + (S.dir ? '권한 허용하고 시작' : '시작하기') + '</button></div></div>';
}

// ---------- 이벤트
function allowed() { return true; }
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  var a = t.dataset.act, n = +t.dataset.n;
  if (a === 'go') { S.screen = t.dataset.v; render(); }
  else if (a === 'setup') { S.loaded = false; S.loading = false; S.err = ''; render(); }
  else if (a === 'reload') { if (S.dir || S.files) { S.err = ''; loadAll(); } else { S.loaded = false; render(); } }
  else if (a === 'pickdir') { window.showDirectoryPicker({ mode: 'readwrite' }).then(function (h) { S.dir = h; S.files = null; return idbSet('dir', h); }).then(render).catch(function () {}); }
  else if (a === 'start') { var su = $('surl'); if (su) { S.sheetUrl = su.value.trim(); lsSet('sheetUrl', S.sheetUrl); } if (S.dir) { perm(S.dir, true).then(function (p) { if (p === 'granted') loadAll(); else { S.err = '폴더를 열 권한이 허용되지 않았습니다.'; render(); } }); } else loadAll(); }
  else if (a === 'pick') { S.picked[n] = !S.picked[n]; render(); }
  else if (a === 'npick') { S.npicked[n] = !S.npicked[n]; render(); }
  else if (a === 'dqset') { S.q = +t.dataset.q; render(); }
  else if (a === 'pickall') { viewRenew().forEach(function (r) { if (planRenew(r).status !== 'no') S.picked[r.n] = true; }); render(); }
  else if (a === 'sapply') {
    if (!S.sampleSel) { alert('샘플 계약서를 먼저 고르세요.'); return; }
    var cnt = 0; viewRenew().forEach(function (r) { if (S.picked[r.n]) { S.sampleFor[r.n] = S.sampleSel; cnt++; } });
    if (!cnt) alert('샘플을 적용할 사람을 먼저 체크해 주세요.'); render();
  }
  else if (a === 'sclear') { viewRenew().forEach(function (r) { if (S.picked[r.n]) delete S.sampleFor[r.n]; }); render(); }
  else if (a === 'fclear') { if (t.dataset.w === 'nfc') { S.nfc = ''; S.nfk = ''; } else { S.fc = ''; S.fk = ''; } render(); }
  else if (a === 'pickclear') { S.picked = {}; render(); }
  else if (a === 'applybatch') { viewRenew().forEach(function (r) { if (S.picked[r.n]) S.months[r.n] = S.batch === 'same' ? 0 : +S.batch; }); render(); }
  else if (a === 'tplmode') { S.tplMode = t.dataset.m; if (S.tplMode === 'fixed' && !S.tplRel && sampleList(S.tplQ).length) S.tplRel = sampleList(S.tplQ)[0].rel; render(); }
  else if (a === 'npmode') { S.np.mode = t.dataset.m; render(); }
  else if (a === 'makeRenew') {
    var ps = renewRows().filter(function (r) { return S.picked[r.n]; }).map(planRenew).filter(function (p) { return p.status !== 'no'; });
    if (ps.length) makeList('renew', ps);
  } else if (a === 'makeNew') {
    var ns = newRows().filter(function (r) { return S.npicked[r.n]; }).map(planNew).filter(function (p) { return p.status !== 'no'; });
    if (ns.length) makeList('new', ns);
  } else if (a === 'sel') { S.sel = +t.dataset.i; render(); }
  else if (a === 'ack') { S.acks[S.sel] = !S.acks[S.sel]; render(); }
  else if (a === 'ackall') { S.made.forEach(function (x, i) { if (!x.bad) S.acks[i] = true; }); render(); }
  else if (a === 'dlone') { var m = S.made[S.sel]; dl(new Blob([m.bytes]), m.fname); }
  else if (a === 'saveone') { var m1 = S.made[S.sel]; S.busy = '저장 중...'; render(); saveDrive(m1).then(function () { S.busy = ''; render(); }); }
  else if (a === 'dlall') {
    var z = new JSZip(), used = {};
    S.made.forEach(function (x) { var p = x.zipPath; while (used[p]) p = p.replace(/\.hwp$/i, '_2.hwp'); used[p] = 1; z.file(p, x.bytes); });
    z.generateAsync({ type: 'blob', compression: 'DEFLATE' }).then(function (b) { var d = new Date(); dl(b, '계약서_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.zip'); });
  } else if (a === 'saveall') {
    var i = 0; S.busy = '저장 중...'; render();
    (function next() { if (i >= S.made.length) { S.busy = '전체 저장 시도 끝'; render(); return; } var m2 = S.made[i++]; S.busy = '저장 중 ' + i + ' / ' + S.made.length; render(); saveDrive(m2).then(next); })();
  }
});
document.addEventListener('change', function (e) {
  var t = e.target; if (!t.dataset || !t.dataset.act) return;
  var a = t.dataset.act, n = +t.dataset.n;
  if (a === 'surl') { S.sheetUrl = t.value.trim(); lsSet('sheetUrl', S.sheetUrl); }
  else if (a === 'dirfb') { S.files = Array.prototype.slice.call(t.files); S.dir = null; render(); }
  else if (a === 'dq') { var m = /(\d+)/.exec(t.value); S.q = m ? Math.min(365, +m[1]) : S.q; render(); }
  else if (a === 'sq') { S.sampleQ = t.value; render(); }
  else if (a === 'ssel') { S.sampleSel = t.value; }
  else if (a === 'fc' || a === 'fk' || a === 'nfc' || a === 'nfk') { S[a] = t.value; render(); }
  else if (a === 'tq') { S.tplQ = t.value; render(); }
  else if (a === 'batch') { S.batch = t.value === 'same' ? 'same' : +t.value; render(); }
  else if (a === 'months') { S.months[n] = +t.value; render(); }
  else if (a === 'tpl') { S.tplRel = t.value; render(); }
  else if (a === 'npmonths') { S.np.months = +t.value; render(); }
  else if (a === 'npstart') { S.np.start = t.value; render(); }
  else if (a === 'npend') { S.np.end = t.value; render(); }
  else if (a === 'nedit') { (S.nedit[n] = S.nedit[n] || {})[t.dataset.col] = t.value.trim(); render(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.act === 'dq') e.target.blur(); });

function start() {
  S.sheetUrl = lsGet('sheetUrl') || DEF_URL;
  render();
  idbGet('dir').then(function (h) {
    if (!h) return;
    S.dir = h; render();
    perm(h, false).then(function (p) { if (p === 'granted' && !S.loaded && !S.loading) loadAll(); });
  });
}
start();
})();

</script>
</body>
